schema_version = "1.0.0"

id = "photometric_light_plus"
version = "1.0.1"
name = "Photometric Light Plus"
tagline = "IES and EULUMDAT lights with a viewport photometric halo"
maintainer = "Marco Caturano <info@marcocaturano.com>"
type = "add-on"

website = "https://github.com/Amon3DArt/photometric-light-plus"

tags = ["Lighting", "Import-Export"]

blender_version_min = "4.5.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Marco Caturano"]

[permissions]
files = "Read IES and LDT photometric files chosen by the user"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/*.zip",
  "/tests/",
  "*.pyc",
  ".DS_Store",
]
